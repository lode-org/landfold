<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="lfIconTitle">
  <title id="lfIconTitle">landfold</title>
  <desc>A landscape sheet folded along a sigmoid, two basins, one query</desc>
  <rect width="64" height="64" rx="14" fill="#1E1B4B"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#312E81" stroke-width="1.2"/>
  <!-- One sheared sheet -->
  <path d="M16 24 L46 16 L52 44 L22 52 Z" fill="none" stroke="#A5B4FC" stroke-width="1.45" stroke-linejoin="round"/>
  <!-- Sigmoid crease -->
  <path d="M20 32 C26 24 30 38 34 36 C38 34 42 48 50 42" fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Two wells -->
  <ellipse cx="27" cy="42" rx="6.4" ry="4.2" fill="none" stroke="#C7D2FE" stroke-width="1.15"/>
  <ellipse cx="27" cy="42" rx="3.6" ry="2.3" fill="none" stroke="#C7D2FE" stroke-width="1.05"/>
  <ellipse cx="43" cy="28" rx="6.4" ry="4.2" fill="none" stroke="#C7D2FE" stroke-width="1.15"/>
  <ellipse cx="43" cy="28" rx="3.6" ry="2.3" fill="none" stroke="#C7D2FE" stroke-width="1.05"/>
  <circle cx="27" cy="42" r="2.05" fill="#FBBF24"/>
  <circle cx="43" cy="28" r="2.05" fill="#FBBF24"/>
  <circle cx="34" cy="36" r="2.45" fill="#EEF2FF"/>
</svg>
