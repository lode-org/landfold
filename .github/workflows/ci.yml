name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: readcon
            features: readcon
          - name: chemfiles-hdf5
            features: readcon-chemfiles,hdf5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native trajectory dependencies
        if: matrix.name == 'chemfiles-hdf5'
        run: sudo apt-get update && sudo apt-get install --yes cmake libhdf5-dev pkg-config
      - name: Test
        run: cargo test --locked --all-targets ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
      - name: Clippy
        if: matrix.name == 'default'
        run: cargo clippy --locked --all-targets -- -D warnings

  contracts:
    name: Python and metadata contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python development headers
        run: sudo apt-get update && sudo apt-get install --yes cmake libhdf5-dev pkg-config python3-dev
      - name: Validate metadata and Python pin
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          bash scripts/check_pyo3_pin.sh
      - name: Test Python provenance contract
        run: cargo test --locked --features python --test pyo3_pin
      - name: Strict feature Clippy
        run: cargo clippy --locked --all-targets --features python,readcon-chemfiles,hdf5 -- -D warnings
      - name: Document the complete feature matrix
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps

  python-bridge:
    name: Chemparseplot HDF5 bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install bridge dependencies
        run: python -m pip install --disable-pip-version-check maturin pytest
      - name: Build and install Python wheel
        run: |
          python -m maturin build --locked --release --out dist
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m pip install "${wheel}[chemparseplot]"
      - name: Test Chemparseplot HDF5 bridge
        run: python -m pytest -q tests/python

  workflow-schema:
    name: Workflow schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse and validate workflow shape
        run: |
          ruby -e 'require "yaml"; workflow = YAML.load_file(".github/workflows/ci.yml"); triggers = workflow["on"] || workflow[true]; abort "missing workflow name" unless workflow["name"]; abort "missing triggers" unless triggers; abort "missing jobs" unless workflow["jobs"].is_a?(Hash) && workflow["jobs"].any?'
