name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check default targets
        run: cargo test --locked --all-targets
      - name: Check readcon integration
        run: cargo test --locked --features readcon
      - name: Check Python dependency contract
        run: bash scripts/check_pyo3_pin.sh
