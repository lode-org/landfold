[package]
name = "landfold"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Landscape And Nonlinear Distance Folding Onto Low Dimensions"
repository = "https://github.com/HaoZeke/landfold"
readme = "README.md"
license = "MIT"
keywords = ["dimensionality-reduction", "mds", "free-energy", "comp-chem"]
categories = ["science", "mathematics"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
exclude = ["oracle/*", "examples/cosmo-lj38/out/*", ".grok/*", "dist/*"]

[lib]
name = "landfold"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "landfold"
path = "src/bin/landfold.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
python = ["dep:pyo3", "dep:numpy"]
plot = ["dep:plotters"]
highs = ["xtsci-optimize/highs"]
readcon = ["dep:readcon-core"]
readcon-chemfiles = ["readcon", "readcon-core/chemfiles"]
hdf5 = ["dep:hdf5"]

[dependencies]
ndarray = "0.17"
nalgebra = "0.33"
serde_json = "1"
thiserror = "2"
eindir-core = {
    version = "0.6.0",
    git = "https://github.com/HaoZeke/eindir.git",
    rev = "f3c42130bb389ba6cd6e4cfdc8b2e182f4a764e9",
    features = ["capi"],
}
xtsci-optimize = {
    version = "0.1.0",
    git = "https://github.com/HaoZeke/xtsci-optimize.git",
    rev = "c1caf2aa31c075b3f248ef95522e9b0da8e01e4a",
}
# clap is used only by the landfold binary in this single package.
clap = { version = "4.5", features = ["derive"] }
# dlpk 0.4.1 optional pyo3 is 0.29. python feature matches that major.
# dlpk/pyo3 stays off so this crate owns the single pyo3-ffi links=python edge.
dlpk = { version = "0.4.1", features = ["ndarray"] }
rayon = { version = "1.10", optional = true }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
numpy = { version = "0.29", optional = true }
plotters = { version = "0.3", optional = true }
readcon-core = { git = "https://github.com/HaoZeke/readcon-core.git", tag = "v0.14.7", version = "0.14.7", optional = true }
hdf5 = { package = "hdf5-metno", version = "0.14.1", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "chi"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
