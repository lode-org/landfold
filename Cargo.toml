[package]
name = "landfold"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Landscape And Nonlinear Distance Folding Onto Low Dimensions"
repository = "https://github.com/HaoZeke/landfold"
readme = "README.md"
license = "MIT"
keywords = ["dimensionality-reduction", "mds", "free-energy", "comp-chem"]
categories = ["science", "mathematics"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
exclude = ["oracle/*", "examples/cosmo-lj38/out/*"]

[lib]
name = "landfold"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "landfold"
path = "src/bin/landfold.rs"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
python = ["dep:pyo3", "dep:numpy"]
plot = ["dep:plotters"]

[dependencies]
ndarray = "0.17"
nalgebra = "0.33"
thiserror = "2"
# clap is used only by the landfold binary in this single package (landfold-w1p0).
clap = { version = "4.5", features = ["derive"] }
dlpk = { version = "0.1.5", features = ["ndarray"] }
rayon = { version = "1.10", optional = true }
pyo3 = { version = "0.26", features = ["extension-module"], optional = true }
numpy = { version = "0.26", optional = true }
plotters = { version = "0.3", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "chi"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
