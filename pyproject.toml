[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "landfold"
dynamic = ["version"]
description = "Landscape And Nonlinear Distance Folding Onto Low Dimensions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=2.0"]

[tool.maturin]
features = ["python"]
module-name = "landfold"
